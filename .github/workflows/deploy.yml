# GrinKingdom — automatic deployment to GitHub Pages
# Trigger: every push to `main`.
# Output: the built site is served from GitHub Pages (actions/deploy-pages).
#
# To use a CUSTOM DOMAIN later:
#   1. Add your domain in the repo Settings → Pages → Custom domain (or add a CNAME file).
#   2. Change BASE_PATH below to "/" and un-comment the `base` switch in vite.config.js.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /GrinKingdom/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
